<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <title>UrnaBrasil – Simulador Urna Eletrônica TSE 2026</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
        <meta name="description" content="Simulador fiel da Urna Eletrônica TSE – Vista Paisagem – Eleições 2026"/>
        <meta name="theme-color" content="#1a1a1a"/>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=VT323&amp;family=Orbitron:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap"/>
        <h:outputStylesheet library="css" name="urna.css"/>
    </h:head>

    <h:body>

        <script type="text/javascript">
            var CANDIDATOS_JSON = #{urnaBean.candidatosJson};
        </script>

        <div id="page-wrapper">

            <!-- ════════════════════════════════════════════════════
                 URNA — VISTA PAISAGEM (REALISTA)
                 ════════════════════════════════════════════════════ -->
            <div id="urna">

                <!-- ─────────────────────────────────────────────
                     LADO ESQUERDO — TELA (CHASSI CLARO)
                     ───────────────────────────────────────────── -->
                <div id="urna-left-panel">
                    <div id="screen-frame">
                        <div id="urna-screen">

                            <div id="votando-overlay">
                                <div id="votando-spinner"></div>
                                <div id="votando-texto">REGISTRANDO VOTO</div>
                            </div>

                            <div id="cargo-header">
                                <div id="cargo-titulo">PRESIDENTE</div>
                                <div id="cargo-descricao">Presidente da República</div>
                            </div>

                            <div id="numero-label">NÚMERO DO CANDIDATO</div>
                            <div id="digitos-wrapper"></div>

                            <div id="candidato-section">
                                <div id="candidato-avatar">
                                    <div id="candidato-avatar-initials"></div>
                                    <div id="candidato-avatar-partido"></div>
                                </div>
                                <div id="candidato-info">
                                    <div id="candidato-nome-urna"></div>
                                    <div id="candidato-nome-completo-urna"></div>
                                    <div id="candidato-partido-urna"></div>
                                    <div id="candidato-sigla-urna"></div>
                                    <div id="candidato-vice-label"></div>
                                    <div id="candidato-vice-urna"></div>
                                </div>
                            </div>

                            <div id="confirmacao-box">
                                <div id="confirmacao-titulo">CONFIRME SEU VOTO</div>
                            </div>

                            <div id="fim-votacao-section">
                                <div id="fim-titulo">FIM</div>
                                <div id="votos-resumo"></div>
                            </div>

                            <div id="urna-mensagem-texto"></div>
                            <div id="cargo-progress"></div>

                        </div>
                    </div>
                </div>

                <!-- ─────────────────────────────────────────────
                     LADO DIREITO — TECLADO E BRANDING
                     ───────────────────────────────────────────── -->
                <div id="urna-right-panel">
                    
                    <div id="je-top-branding">
                        <div id="brasao-svg-wrap">
                            <h:outputText escape="false" value="&lt;svg width='38' height='38' viewBox='0 0 60 60'&gt;
                                &lt;circle cx='30' cy='30' r='28' fill='#009b3a' stroke='#fedf00' stroke-width='2.5'/&gt;
                                &lt;polygon points='30,6 54,30 30,54 6,30' fill='#fedf00'/&gt;
                                &lt;circle cx='30' cy='30' r='16' fill='#002776'/&gt;
                                &lt;path d='M15,29 Q30,23 45,29' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round'/&gt;
                                &lt;circle cx='30' cy='20' r='2' fill='white'/&gt;
                                &lt;circle cx='22' cy='27' r='1.6' fill='white'/&gt;
                                &lt;circle cx='38' cy='27' r='1.6' fill='white'/&gt;
                                &lt;circle cx='25' cy='34' r='1.4' fill='white'/&gt;
                                &lt;circle cx='35' cy='34' r='1.4' fill='white'/&gt;
                                &lt;circle cx='30' cy='38' r='1.3' fill='white'/&gt;
                                &lt;circle cx='20' cy='33' r='1.1' fill='white'/&gt;
                                &lt;circle cx='40' cy='33' r='1.1' fill='white'/&gt;
                            &lt;/svg&gt;"/>
                        </div>
                        <div id="je-nome-full">
                            <div class="je-titulo">JUSTIÇA<br/>ELEITORAL</div>
                        </div>
                    </div>

                    <div id="keyboard-panel">
                        <div id="teclado">
                            <div class="teclado-linha">
                                <button id="btn-1" class="btn-urna btn-numerico" onclick="Urna.pressionar('1')" type="button">1</button>
                                <button id="btn-2" class="btn-urna btn-numerico" onclick="Urna.pressionar('2')" type="button">2</button>
                                <button id="btn-3" class="btn-urna btn-numerico" onclick="Urna.pressionar('3')" type="button">3</button>
                            </div>
                            <div class="teclado-linha">
                                <button id="btn-4" class="btn-urna btn-numerico" onclick="Urna.pressionar('4')" type="button">4</button>
                                <button id="btn-5" class="btn-urna btn-numerico" onclick="Urna.pressionar('5')" type="button">5</button>
                                <button id="btn-6" class="btn-urna btn-numerico" onclick="Urna.pressionar('6')" type="button">6</button>
                            </div>
                            <div class="teclado-linha">
                                <button id="btn-7" class="btn-urna btn-numerico" onclick="Urna.pressionar('7')" type="button">7</button>
                                <button id="btn-8" class="btn-urna btn-numerico" onclick="Urna.pressionar('8')" type="button">8</button>
                                <button id="btn-9" class="btn-urna btn-numerico" onclick="Urna.pressionar('9')" type="button">9</button>
                            </div>
                            <div class="teclado-linha teclado-linha-zero">
                                <button id="btn-0" class="btn-urna btn-numerico" onclick="Urna.pressionar('0')" type="button">0</button>
                            </div>
                            
                            <div class="teclado-linha-acao">
                                <button id="btn-branco" class="btn-urna btn-branco" onclick="Urna.votoBranco()" type="button">BRANCO</button>
                                <button id="btn-corrige" class="btn-urna btn-corrige" onclick="Urna.corrigir()" type="button">CORRIGE</button>
                                <button id="btn-confirma-id" class="btn-urna btn-confirma" onclick="Urna.confirmar()" type="button">CONFIRMA</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div><!-- /urna -->

            <div id="btn-exportar-container">
                <button id="btn-acompanhar" class="btn-acao" onclick="window.location.href='apuracao.xhtml'" type="button" style="background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);">
                    📊 Acompanhar Votação
                </button>
                <button id="btn-nova-votacao" class="btn-acao" onclick="Urna.novaVotacao()" type="button">
                    🔄 Nova Votação
                </button>
            </div>

            <div id="atalhos-hint">
                Teclado: <span>0–9</span>
                <span>Enter = Confirmar</span>
                <span>Backspace = Corrigir</span>
                <span>Espaço = Branco</span>
            </div>

        </div><!-- /page-wrapper -->

        <h:outputScript library="js" name="urna.js"/>

    </h:body>
</html>
